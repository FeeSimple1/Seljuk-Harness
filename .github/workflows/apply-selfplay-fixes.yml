name: Verify and publish self-play fixes
on:
  push:
    branches: ['fix/selfplay-full-card-20261009']
    paths:
      - '.github/selfplay-patch.part*'
      - '.github/workflows/apply-selfplay-fixes.yml'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksummed patch and verify exact source tree
        run: |
          python - <<'PY'
          import bz2
          import hashlib
          import subprocess
          from pathlib import Path
          parts = [Path(f'.github/selfplay-patch.part{i}') for i in (1, 2)]
          patch = bz2.decompress(b''.join(p.read_bytes() for p in parts))
          expected = 'ea4bf52819e4185d79ea26cb10de7f4bb39dcdb65a41b07411e02c191c8454a9'
          assert hashlib.sha256(patch).hexdigest() == expected, 'patch checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'rm', *map(str, parts), '.github/workflows/apply-selfplay-fixes.yml'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'c3418447bfdc56064c93660c223b8ca9e069b66f', tree
          print('Verified source tree:', tree)
          PY
          git diff --cached --stat
      - name: Install
        run: python -m pip install -e '.[dev]' pytest
      - name: Full regression suite including the 132-action replay
        run: python -m pytest -q --junitxml=test-results.xml | tee selfplay-test-results.txt
      - name: Round-trip move sweep
        env:
          PYTHONPATH: src
        run: python scripts/roundtrip_sweep.py --seeds 1,2,3,4,5 | tee roundtrip-results.txt
      - name: Aggressive smoke checks
        env:
          PYTHONPATH: src
        run: python scripts/smoke_fuzz.py --rounds 2 --seeds 1,2,3 | tee smoke-results.txt
      - name: Commit and publish verified fixes on the self-play branch
        run: |
          test "$(git write-tree)" = c3418447bfdc56064c93660c223b8ca9e069b66f
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: full-card command costs, Summer Heat timing, and Marwanid choices' -m 'Preserve a 132-action deliberately played Manzikert replay and add 39 regression cases. All 864 tests, 25 move sweeps, and 30 smoke runs pass before publication.'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Bundle tested source and diagnostics
        if: always()
        run: |
          git bundle create repository.bundle HEAD
          git diff HEAD --binary > uncommitted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-selfplay-fixes
          path: |
            repository.bundle
            uncommitted.patch
            test-results.xml
            selfplay-test-results.txt
            roundtrip-results.txt
            smoke-results.txt
          retention-days: 7

name: Verify and publish compact LLM interface
on:
  push:
    branches: [publish/compact-llm-interface-20261016]
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact tested source
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, lzma, os
          from pathlib import Path
          root = Path('.github/transfer/compact-interface')
          compressed = b''.join((root / f'part-{i:02}.xz').read_bytes() for i in range(1, 14))
          assert hashlib.sha256(compressed).hexdigest() == '0544e7d06abb9f3d9c4e5cad473e0d5f67157e15a5ab03d0de821807a00f3823'
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '34665eb0693def9358ae81eaadf1a349727fe6aaeda978b1743138d96608eefa'
          (Path(os.environ['RUNNER_TEMP']) / 'interface.patch').write_bytes(patch)
          PY
          git checkout --detach 18d03047effb527dced80679cefcdd01341a2e9c
          git apply "$RUNNER_TEMP/interface.patch"
          python scripts/build_llm_references.py
          git add .
          test "$(git write-tree)" = '6ddd4abd055f8114f57b07304aa3af9db89e8e85'
          git config user.name OpenAI
          git config user.email noreply@openai.com
          GIT_AUTHOR_DATE='2026-10-16T06:34:22Z' GIT_COMMITTER_DATE='2026-10-16T06:34:22Z' git commit -m 'Add compact versioned LLM navigation with complete player decisions' -m 'Preserve the full validated palette, explicit planning constraints, player-owned responses, private inspection, and save/resume. Add 78 interface cases and two complete replay-based output benchmarks; 1067 tests pass, with clean scenario sweeps and smoke checks.'
          test "$(git rev-parse HEAD)" = '36cb5a053b7c357ddeeb08a48913c21d45c9ab04'
          git diff --check HEAD^ HEAD
      - name: Install tests and optional token counter
        run: python -m pip install -e '.[dev]' tiktoken
      - name: Full regression suite
        shell: bash
        run: python -m pytest -q --junitxml=interface-tests.xml | tee interface-tests.txt
      - name: Verify all 1067 cases passed
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('interface-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) == 1067
          for name in ('failures', 'errors', 'skipped'):
              assert sum(int(s.get(name, 0)) for s in suites) == 0, name
          PY
      - name: Scenario move sweep
        env:
          PYTHONPATH: src
        shell: bash
        run: python scripts/roundtrip_sweep.py --seeds 1,2,3,4,5 | tee interface-roundtrip.txt
      - name: Aggressive smoke checks
        env:
          PYTHONPATH: src
        shell: bash
        run: python scripts/smoke_fuzz.py --rounds 2 --seeds 1,2,3 | tee interface-smoke.txt
      - name: Full replay output measurement including follow-up requests
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/seljuk-interface-base" 18d03047effb527dced80679cefcdd01341a2e9c
          python scripts/benchmark_llm_interface.py --baseline-root "$RUNNER_TEMP/seljuk-interface-base" --output interface-metrics | tee interface-benchmark.txt
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('interface-metrics/summary.json').read_text())
          assert summary['tokenizer'] == 'o200k_base'
          for name, workload in summary['workloads'].items():
              assert workload['legacy']['final'] == workload['compact']['final']
              assert workload['compact']['raw']['tokens'] is not None
              print(name, 'legacy_tokens', workload['legacy']['raw']['tokens'], 'compact_tokens', workload['compact']['raw']['tokens'], 'reduction', workload['token_reduction_vs_legacy_raw'])
          PY
      - name: Publish verified clean feature branch without overwriting work
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '36cb5a053b7c357ddeeb08a48913c21d45c9ab04'
          test "$(git rev-parse HEAD^{tree})" = '6ddd4abd055f8114f57b07304aa3af9db89e8e85'
          test -z "$(git status --porcelain --untracked-files=no)"
          target='refs/heads/feature/compact-llm-interface-20261016'
          current="$(git ls-remote origin "$target" | cut -f1)"
          case "$current" in
            ''|18d03047effb527dced80679cefcdd01341a2e9c|36cb5a053b7c357ddeeb08a48913c21d45c9ab04) ;;
            *) echo 'Feature branch changed; refusing to overwrite.' >&2; exit 1 ;;
          esac
          git push origin "HEAD:$target"
          printf '%s\n' 'commit 36cb5a053b7c357ddeeb08a48913c21d45c9ab04' 'tree 6ddd4abd055f8114f57b07304aa3af9db89e8e85' > interface-source.txt
          git bundle create interface-source.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-interface-verification
          path: |
            interface-tests.xml
            interface-tests.txt
            interface-roundtrip.txt
            interface-smoke.txt
            interface-benchmark.txt
            interface-source.txt
            interface-source.bundle
            interface-metrics/*.json
            interface-metrics/*.jsonl
          retention-days: 14

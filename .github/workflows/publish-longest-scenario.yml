name: Verify and publish longest-scenario fixes
on:
  push:
    branches:
      - publish/longest-scenario-20261010
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact checksummed fix commit
        run: |
          python - <<'PY'
          import hashlib
          import lzma
          import os
          from pathlib import Path
          root = Path('.github/transfer/longest-scenario')
          compressed = b''.join((root / f'part-{i}.xz').read_bytes() for i in (1, 2, 3))
          assert hashlib.sha256(compressed).hexdigest() == 'f203f99563f084d0b49efecfdf1d69c3b7c9dc3f3286665051691a24887b1f41'
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'e79d4e31f06951940c31a8c45567c528ff13657cb2266da9328ae34cdddca120'
          (Path(os.environ['RUNNER_TEMP']) / 'longest-scenario.patch').write_bytes(patch)
          PY
          git checkout --detach f1cd077be15d7a4c97b36877d0a77961c41c7d02
          git config user.name OpenAI
          git config user.email noreply@openai.com
          GIT_COMMITTER_DATE='2026-10-10T15:26:37+00:00' git am "$RUNNER_TEMP/longest-scenario.patch"
          test "$(git rev-parse HEAD)" = '24ce98a6cbeb9b7453908163ee7b0bac0a0992b6'
          test "$(git rev-parse 'HEAD^{tree}')" = '5b3c4b3b27feccdf9a4279394792f802a0eef023'
          git diff --check HEAD^ HEAD
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Full regression suite
        run: python -m pytest -q --junitxml=publication-tests.xml | tee publication-tests.txt
      - name: Verify all 901 cases passed
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('publication-tests.xml').getroot()
          suites = list(root.iter('testsuite'))
          assert sum(int(s.attrib.get('tests', 0)) for s in suites) == 901
          for name in ('failures', 'errors', 'skipped'):
              assert sum(int(s.attrib.get(name, 0)) for s in suites) == 0, name
          PY
      - name: Scenario move sweep
        env:
          PYTHONPATH: src
        run: python scripts/roundtrip_sweep.py --seeds 1,2,3,4,5 | tee publication-roundtrip.txt
      - name: Aggressive smoke checks
        env:
          PYTHONPATH: src
        run: python scripts/smoke_fuzz.py --rounds 2 --seeds 1,2,3 | tee publication-smoke.txt
      - name: Publish tested commit without overwriting other work
        run: |
          test "$(git rev-parse HEAD)" = '24ce98a6cbeb9b7453908163ee7b0bac0a0992b6'
          test -z "$(git status --porcelain --untracked-files=no)"
          target='refs/heads/fix/longest-scenario-20261010'
          current="$(git ls-remote origin "$target" | cut -f1)"
          case "$current" in
            ''|f1cd077be15d7a4c97b36877d0a77961c41c7d02|24ce98a6cbeb9b7453908163ee7b0bac0a0992b6) ;;
            *) echo 'Target branch changed; refusing to overwrite it.' >&2; exit 1 ;;
          esac
          git push origin "HEAD:$target"
          printf '%s\n' 'commit 24ce98a6cbeb9b7453908163ee7b0bac0a0992b6' 'tree 5b3c4b3b27feccdf9a4279394792f802a0eef023' > publication-source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longest-scenario-publication-verification
          path: |
            publication-tests.xml
            publication-tests.txt
            publication-roundtrip.txt
            publication-smoke.txt
            publication-source.txt
          retention-days: 7

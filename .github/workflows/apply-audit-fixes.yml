name: Apply and verify audit fixes
on:
  push:
    branches: ['fix/audit-regressions-20261009']
    paths: ['.github/workflows/apply-audit-fixes.yml', '.github/audit-payload-*.xz.part']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksummed patch and verify exact source tree
        run: |
          python - <<'PY'
          import hashlib, lzma, os, shutil, subprocess
          from pathlib import Path
          parts = [f'.github/audit-payload-{i}.xz.part' for i in range(1, 5)]
          patch = lzma.decompress(b''.join(Path(p).read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == '76dd6365b37aaefe3ee499669363c6d95ebbd8e6c3a1167151975b9815a51721'
          patch_path = Path(os.environ['RUNNER_TEMP']) / 'audit.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          index = subprocess.check_output(['git', 'rev-parse', '--git-path', 'index'], text=True).strip()
          verify_index = Path(os.environ['RUNNER_TEMP']) / 'verify.index'
          shutil.copyfile(index, verify_index)
          env = dict(os.environ, GIT_INDEX_FILE=str(verify_index))
          subprocess.run(['git', 'update-index', '--force-remove', *parts, '.github/workflows/apply-audit-fixes.yml'], env=env, check=True)
          tree = subprocess.check_output(['git', 'write-tree'], env=env, text=True).strip()
          assert tree == 'd3e69cbd56c7cea1de6d760f2b74311db9871020', tree
          Path('verified-tree.txt').write_text(tree + '\n')
          print('Verified exact tested source tree:', tree)
          PY
      - name: Install
        run: python -m pip install -e '.[dev]' pytest
      - name: Full regression suite
        run: python -m pytest -q --junitxml=audit-patch-test-results.xml
      - name: Round-trip move sweep
        env:
          PYTHONPATH: src
        run: python scripts/roundtrip_sweep.py --seeds 1,2,3,4,5 | tee audit-patch-roundtrip.txt
      - name: Aggressive smoke checks
        env:
          PYTHONPATH: src
        run: python scripts/smoke_fuzz.py --rounds 2 --seeds 1,2,3 | tee audit-patch-smoke.txt
      - name: Commit verified fixes on the audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolve all 20 chat audit findings with 52 regression cases'
          git push origin HEAD:refs/heads/fix/audit-regressions-20261009
          git rev-parse HEAD | tee publish-sha.txt
      - name: Bundle tested source
        if: always()
        run: git bundle create repository.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-audit-fixes
          path: |
            repository.bundle
            audit-patch-test-results.xml
            audit-patch-roundtrip.txt
            audit-patch-smoke.txt
            verified-tree.txt
            publish-sha.txt
          retention-days: 7

name: Verify and publish Showdown rules corrections
on:
  push:
    branches:
      - publish/showdown-rules-20261016
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact checksummed rules fix
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .github/transfer/showdown-fixes.patch.xz
          echo '4f755083e4e5cb4a38464833daaa79fcc0259020030cb377e9c21a59b19ac2a4  .github/transfer/showdown-fixes.patch.xz' | sha256sum -c -
          xz -dc .github/transfer/showdown-fixes.patch.xz > "$RUNNER_TEMP/showdown.patch"
          echo "69cfb08adc76e383c87ea52f8a83415fdcd1e13637bfd01fb522d5a1136822b1  $RUNNER_TEMP/showdown.patch" | sha256sum -c -
          git checkout --detach 36cb5a053b7c357ddeeb08a48913c21d45c9ab04
          git config user.name OpenAI
          git config user.email noreply@openai.com
          GIT_COMMITTER_DATE='2026-10-16T14:18:46Z' git am "$RUNNER_TEMP/showdown.patch"
          test "$(git rev-parse HEAD)" = 55f115c386f2726de81a01f4990bc858bf40af67
          test "$(git rev-parse 'HEAD^{tree}')" = af1e3114ffa30071ac95d2908012b00a73b40b9c
          git diff --check HEAD^ HEAD
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --junitxml=showdown-tests.xml | tee showdown-tests.txt
      - name: Verify 1089 passed with zero failures, errors or skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites=list(ET.parse('showdown-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib.get('tests',0)) for s in suites)==1089
          for name in ('failures','errors','skipped'):
              assert sum(int(s.attrib.get(name,0)) for s in suites)==0, name
          PY
      - name: Move round-trip sweep
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python scripts/roundtrip_sweep.py --seeds 1,2,3,4,5 | tee showdown-roundtrip.txt
      - name: Aggressive smoke checks
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python scripts/smoke_fuzz.py --rounds 2 --seeds 1,2,3 | tee showdown-smoke.txt
      - name: Publish exact validated fix commit without overwriting changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 55f115c386f2726de81a01f4990bc858bf40af67
          test -z "$(git status --porcelain --untracked-files=no)"
          target='refs/heads/fix/showdown-rules-20261016'
          current="$(git ls-remote origin "$target" | cut -f1)"
          case "$current" in
            ''|36cb5a053b7c357ddeeb08a48913c21d45c9ab04|55f115c386f2726de81a01f4990bc858bf40af67) ;;
            *) echo 'Target branch changed; refusing to overwrite.' >&2; exit 1 ;;
          esac
          git push origin "HEAD:$target"
          printf '%s\n' 'commit 55f115c386f2726de81a01f4990bc858bf40af67' 'tree af1e3114ffa30071ac95d2908012b00a73b40b9c' > showdown-source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showdown-rules-verification
          path: |
            showdown-tests.xml
            showdown-tests.txt
            showdown-roundtrip.txt
            showdown-smoke.txt
            showdown-source.txt
          retention-days: 14

name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]' pytest
      - name: Test
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Round-trip move sweep
        env:
          PYTHONPATH: src
        run: python scripts/roundtrip_sweep.py --seeds 1,2,3,4,5 | tee roundtrip-results.txt
      - name: Aggressive smoke checks
        env:
          PYTHONPATH: src
        run: python scripts/smoke_fuzz.py --rounds 2 --seeds 1,2,3 | tee smoke-results.txt
      - name: Bundle reproducible test source
        if: always()
        run: git bundle create repository.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-source-and-results
          path: |
            repository.bundle
            test-results.xml
            roundtrip-results.txt
            smoke-results.txt
          retention-days: 7
